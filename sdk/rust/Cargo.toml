[package]
name = "galleton"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Blocking client for a local Galleton daemon"
repository = "https://github.com/Microck/galleton"
readme = "README.md"
publish = false

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
